<script>
// Site-wide article search: lazy-fetches /search-index.json (once, on first
// interaction) and shows matching articles as a dropdown — this is what
// makes the header search box search EVERY published article regardless
// of which page you're viewing, not just cards already on the current page.
(function () {
  var input = document.getElementById('site-search-input');
  var results = document.getElementById('site-search-results');
  if (!input || !results) return;

  var index = null;
  var fetching = false;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function loadIndex(onLoaded) {
    if (index) { onLoaded(); return; }
    if (fetching) return;
    fetching = true;
    fetch('/search-index.json').then(function (r) { return r.json(); }).then(function (data) {
      index = data;
      fetching = false;
      onLoaded();
    }).catch(function () { fetching = false; });
  }

  function render(query) {
    if (!query || !index) { results.hidden = true; return; }
    var q = query.toLowerCase();
    var matches = index.filter(function (a) {
      return a.title.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 8);
    results.innerHTML = matches.length
      ? matches.map(function (a) {
          return '<a href="/articles/' + a.slug + '.html">' + escapeHtml(a.title) + '</a>';
        }).join('')
      : '<div class="no-results">No articles found</div>';
    results.hidden = false;
  }

  input.addEventListener('focus', function () { loadIndex(function () {}); });
  input.addEventListener('input', function () {
    var query = input.value.trim();
    if (index) { render(query); } else { loadIndex(function () { render(query); }); }
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.site-search')) { results.hidden = true; }
  });
})();
</script>
